<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkers</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .board { display: grid; grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); width: 480px; height: 480px; margin: 20px auto; border: 4px solid #333; }
        .square { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        .piece { width: 45px; height: 45px; border-radius: 50%; cursor: pointer; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .red-piece { background-color: #e74c3c; }
        .black-piece { background-color: #2c3e50; }
    </style>
</head>
<body>
    <h1>🔴 Checkers</h1>
    <p>Local Pass & Play Mode</p>
    <div class="board" id="board"></div>
    <a href="index.html" style="color:#666;">← Back Home</a>

    <script>
        const board = document.getElementById('board');
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                
                if ((r + c) % 2 !== 0) {
                    if (r < 3) {
                        const piece = document.createElement('div');
                        piece.className = 'piece red-piece';
                        square.appendChild(piece);
                    } else if (r > 4) {
                        const piece = document.createElement('div');
                        piece.className = 'piece black-piece';
                        square.appendChild(piece);
                    }
                }
                board.appendChild(square);
            }
        }
    </script>
</body>
</html>
