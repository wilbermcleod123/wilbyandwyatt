<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spend Bill's Money</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .bank { background: #2ecc71; color: white; padding: 20px; font-size: 2.5rem; font-weight: bold; border-radius: 8px; margin: 20px auto; max-width: 500px; }
        .shop-item { background: white; padding: 20px; border-radius: 12px; margin: 10px auto; max-width: 500px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 5px; cursor: pointer; }
        .back-link { display: inline-block; margin-top: 30px; color: #666; }
    </style>
</head>
<body>

    <h1>Spend Bill's Money</h1>
    
    <!-- The Global Bank Account balance -->
    <div class="bank">$<span id="money">1000000</span></div>

    <!-- An item to buy -->
    <div class="shop-item">
        <div>
            <h3>🍔 Super Burger</h3>
            <p>$10</p>
        </div>
        <button class="btn" onclick="buyItem(10)">Buy</button>
    </div>

    <!-- Another item to buy -->
    <div class="shop-item">
        <div>
            <h3>📱 Luxury Phone</h3>
            <p>$1000</p>
        </div>
        <button class="btn" onclick="buyItem(1000)">Buy</button>
    </div>

    <a href="index.html" class="back-link">← Go Back Home</a>

    <!-- The interactive code -->
    <script>
        let totalMoney = 1000000;

        function buyItem(price) {
            if (totalMoney >= price) {
                totalMoney -= price;
                document.getElementById('money').innerText = totalMoney.toLocaleString();
            } else {
                alert("You're out of money!");
            }
        }
    </script>
</body>
</html>
