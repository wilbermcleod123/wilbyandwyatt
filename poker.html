<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Poker</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .table { background: #076324; border: 10px solid #5c3a21; border-radius: 150px; max-width: 600px; min-height: 300px; margin: 30px auto; padding: 20px; color: white; display: flex; flex-direction: column; justify-content: space-around; align-items: center; }
        .pot { font-size: 2rem; font-weight: bold; background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 20px; }
        .controls { display: flex; gap: 15px; margin-top: 20px; }
        .poker-btn { padding: 12px 25px; font-size: 1rem; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .bet { background: #2ecc71; } .fold { background: #e74c3c; } .check { background: #f1c40f; color: #333; }
    </style>
</head>
<body>
    <h1>💵 Fake Poker</h1>
    <div class="table">
        <div class="pot">Pot: $<span id="potAmount">0</span></div>
        <div>Your Balance: $<span id="balance">5000</span></div>
    </div>
    <div class="controls">
        <button class="poker-btn bet" onclick="action(500)">Bet $500</button>
        <button class="poker-btn check" onclick="action(0)">Check</button>
        <button class="poker-btn fold" onclick="resetPot()">Fold / Reset</button>
    </div>
    <br><br>
    <a href="index.html" style="color:#666;">← Back Home</a>

    <script>
        let pot = 0;
        let bal = 5000;
        function action(amount) {
            if (bal >= amount) {
                bal -= amount;
                pot += amount;
                document.getElementById('potAmount').innerText = pot;
                document.getElementById('balance').innerText = bal;
            } else { alert("Out of chips!"); }
        }
        function resetPot() {
            pot = 0;
            document.getElementById('potAmount').innerText = pot;
        }
    </script>
</body>
</html>
